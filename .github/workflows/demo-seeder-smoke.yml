name: Demo Seeder Smoke Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  demo-seeder:
    name: Verify demo seeders
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: homebase_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homebase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homebase_test
      NODE_ENV: test
      SESSION_SECRET: ci-demo-seeder-session-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Run demo seeder smoke test
        run: pnpm --filter @workspace/api-server run test:demo-seeder